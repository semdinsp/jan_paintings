# fly.toml app configuration file generated for jan-prints on 2026-10-12T22:13:27-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jan-prints'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'jan-prints.fly.dev'
  PORT = '8080'
  # Images uploaded from the admin pages, kept on the volume below.
  UPLOADS_DIR = '/data/uploads'

# Persistent storage for uploads. Fly creates the volume on first deploy.
[[mounts]]
  source = 'jan_prints_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep the one machine running: it is tied to the volume's host, and a
  # stopped machine can fail to come back if that host fills up.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
